# Builds the Offrava iPhone & Android apps in the cloud (no Mac needed).
# Run it: GitHub → Actions → "Build Offrava app" → Run workflow. Download the results under "Artifacts".
#  • Android: a test APK you can install on any Android phone.
#  • iPhone: a simulator build (checks everything compiles). Store/TestFlight builds need the Apple Developer account + signing secrets.
name: Build Offrava app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-app.yml']

permissions:
  contents: read      # builds only read the code

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npm run www
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#121212' --splashBackgroundColor '#121212'
      - run: npx cap sync android
      - run: node scripts/patch-native.mjs
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: offrava-android-test-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run www
      - run: npx cap add ios
      - run: npx capacitor-assets generate --ios --iconBackgroundColor '#121212' --splashBackgroundColor '#121212'
      - run: npx cap sync ios
      - run: node scripts/patch-native.mjs
      - run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: cd build/Build/Products/Debug-iphonesimulator && zip -qr ../../../../offrava-ios-simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with:
          name: offrava-ios-simulator-build
          path: app/offrava-ios-simulator.zip
